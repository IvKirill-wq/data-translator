# Глоссарий переводов ru → en.
#
# Четыре раздела, в каждом по одной строке на правило: источник = перевод.
# Пробелы вокруг «=» не важны, кавычки не нужны, регистр не важен.
#
#   [whole]   срабатывает, когда ВСЁ значение равно источнику; движок не вызывается
#   [before]  подстановка в русскую строку ДО движка; латиница дальше защищается сама
#   [after]   правка ответа движка, когда он выбрал не тот синоним (англ. → англ.)
#   [keep]    строка без «=»: никогда не переводить, маскируется на время перевода
#
# Варианты регистра и «ё/е» писать не нужно — значения нормализуются.
# Нужны только разные формы: сокращение и полное название.
# Длинные варианты применяются раньше коротких независимо от порядка строк.
# Если один и тот же источник указан в разделе дважды, выигрывает последняя строка.

